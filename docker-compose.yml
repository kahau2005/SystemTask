version: '3.8'

services:
  backend:
    build: ./backend
    container_name: systemtask_backend
    restart: unless-stopped
    volumes:
      - backend_data:/app

  frontend:
    build: ./frontend
    container_name: systemtask_frontend
    ports:
      - "8077:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
